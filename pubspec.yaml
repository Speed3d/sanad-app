name: sales_management
# ─────────────────────────────────────────────────────────────────────────────
# نظام إدارة المبيعات والخزينة
# تطبيق Flutter لـ Web + Android + iOS
# مبني على: Drift (SQLite) + Riverpod + go_router + Material 3
# ─────────────────────────────────────────────────────────────────────────────
description: نظام إدارة المبيعات والخزينة — Flutter Web + Mobile

publish_to: 'none' # لا يُنشر على pub.dev — مشروع خاص

# الإصدار: Major.Minor.Patch+BuildNumber
version: 1.0.0+1

environment:
  # الحد الأدنى من إصدار Dart المطلوب
  sdk: ">=3.5.0 <4.0.0"

# ─────────────────────────────────────────────────────────────────────────────
# التبعيات الرئيسية (dependencies)
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  # مطلوب لدعم الترجمة العربية والإنجليزية
  flutter_localizations:
    sdk: flutter

  # ── قاعدة البيانات المحلية (SQLite) ──────────────────────────────────────
  # Drift: ORM آمن النوع — يدعم Migrations, Reactive Queries, Views
  drift: ^2.23.0
  # مكتبة SQLite الأصلية لـ Android/iOS/Desktop
  sqlite3_flutter_libs: ^0.5.28
  # تكامل Drift مع Flutter — يحدد مسار قاعدة البيانات تلقائياً
  drift_flutter: ^0.2.4
  # SQLite3 لـ Web عبر WASM
  sqlite3: ^2.7.5

  # ── إدارة الحالة (State Management) ─────────────────────────────────────
  # Riverpod 2.x: إدارة الحالة مع دعم Async وCode Generation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── التنقل بين الشاشات (Routing) ─────────────────────────────────────────
  # go_router: التوجيه الإعلاني مع Shell Routes وProtected Routes
  go_router: ^14.8.1

  # ── نماذج البيانات (Data Models) ─────────────────────────────────────────
  # freezed_annotation: كلاسات Immutable مولّدة تلقائياً
  freezed_annotation: ^2.4.4
  # json_annotation: تحويل JSON تلقائي للنماذج
  json_annotation: ^4.9.0

  # ── المصادقة والأمان (Auth & Security) ───────────────────────────────────
  # bcrypt: تشفير كلمات المرور — آمن ضد Brute Force
  bcrypt: ^1.1.3
  # تخزين آمن للـ Token في Keychain/Keystore
  flutter_secure_storage: ^9.2.4
  # pointycastle: AES-256-GCM + PBKDF2 للنسخ الاحتياطية المشفرة
  pointycastle: ^3.9.1
  # (أُزيلت crypto — غير مستخدمة؛ pointycastle تغطي التشفير. تدقيق 2026-08-07)

  # ── Excel (القراءة والكتابة) ──────────────────────────────────────────────
  # excel 4.x: قراءة وكتابة Excel بدون Office — مدعوم على Web/Mobile
  excel: ^4.0.6

  # ── الملفات والمسارات ─────────────────────────────────────────────────────
  # فتح مربع اختيار الملفات على Web + Android + iOS
  file_picker: ^8.3.7
  # الحصول على مسارات النظام (Documents, Cache, Temp)
  path_provider: ^2.1.5
  # عمليات المسارات (join, basename, extension)
  path: ^1.9.1

  # ── الـ UI والتصميم ───────────────────────────────────────────────────────
  # أنيميشن سلس وسهل الاستخدام بدون كود معقد
  flutter_animate: ^4.5.0
  # (أُزيلت shimmer — غير مستخدمة. تدقيق 2026-08-07)
  # التقاط أو اختيار الصور (لوجو الشركة مثلاً)
  image_picker: ^1.1.2
  # مطلوب لـ flutter_localizations (التاريخ والأرقام والعملات)
  intl: ^0.20.2
  # (أُزيلت cached_network_image / image / gap — غير مستخدمة. تدقيق 2026-08-07)

  # ── مكونات UI متقدمة ──────────────────────────────────────────────────────
  # رسوم بيانية للـ Dashboard (خطية، دائرية، شريطية)
  fl_chart: ^0.70.2
  # (أُزيلت data_table_2 — غير مستخدمة. تدقيق 2026-08-07)

  # ── الطباعة وإنشاء PDF ────────────────────────────────────────────────────
  # طباعة PDF ومعاينة قبل الطباعة
  printing: ^5.13.2
  # إنشاء ملفات PDF برمجياً (سندات القبض والصرف)
  pdf: ^3.11.2

  # ملاحظة (تدقيق 2026-08-07): أُزيلت تبعيات غير مستخدمة إطلاقاً لتقليل حجم
  #   البناء وسطح الهجوم:
  #     archive (تُجلَب تلقائياً من excel عند الحاجة)، connectivity_plus، http،
  #     shared_preferences (الإعدادات في Drift)، uuid، logger،
  #     universal_platform، googleapis، google_sign_in، permission_handler.
  #   googleapis/google_sign_in تُعاد عند تنفيذ مزامنة Google Drive الفعلية.

# ─────────────────────────────────────────────────────────────────────────────
# تبعيات التطوير فقط (dev_dependencies) — لا تُضمَّن في الإنتاج
# ─────────────────────────────────────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Code Generation (توليد الكود التلقائي) ───────────────────────────────
  # تشغيل Code Generation (dart run build_runner build)
  build_runner: ^2.4.13
  # Code Generation لـ Drift (الجداول، الـ DAOs، الـ Migrations)
  drift_dev: ^2.23.0
  # Code Generation لـ Riverpod Providers
  riverpod_generator: ^2.6.3
  # Code Generation لنماذج Immutable (Freezed classes)
  freezed: ^2.5.7
  # Code Generation لتحويل JSON (fromJson/toJson)
  json_serializable: ^6.9.0

  # ── جودة الكود ────────────────────────────────────────────────────────────
  # قواعد Linting الرسمية من Flutter
  flutter_lints: ^5.0.0

# ─────────────────────────────────────────────────────────────────────────────
# الأصول (Assets) — الملفات المضمنة في التطبيق
# ─────────────────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true

  # تفعيل توليد ملفات الترجمة تلقائياً من lib/l10n/*.arb
  # (مطلوب لأن المشروع يستخدم l10n.yaml + AppLocalizations المولَّد)
  generate: true

  assets:
    # الخطوط المحلية (لا تحتاج إنترنت — مخزنة في التطبيق نفسه)
    - assets/fonts/
    # الصور والأيقونات الثابتة
    - assets/images/
    # ملفات WASM لـ SQLite على الويب
    - assets/sqlite/

  # ── تعريف الخطوط ──────────────────────────────────────────────────────────
  fonts:
    # Tajawal: خط عربي حديث وجميل — مرخص تحت OFL
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

    # Inter: خط لاتيني Variable (يغطي جميع الأوزان 100-900 في ملف واحد)
    # مرخص تحت OFL — يستخدم للأرقام والنصوص الإنجليزية
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 300
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
