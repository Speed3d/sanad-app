# ─────────────────────────────────────────────────────────────────────────────
# analysis_options.yaml — إعدادات المحلل الثابت (Static Analyzer)
#
# الغرض: تشديد الفحص لأن هذا تطبيق مالي — أي نوع ضمني (dynamic) أو تحويل
# غير آمن قد يُخفي خطأً يمس الأموال.
#
# سبب التشديد (درس مستفاد من تدقيق 2026-08-06):
#   الدالة _handleFailedAttempt في auth_provider.dart كانت تستقبل
#   `required dynamic userRepo` — وهذا عطّل فحص الأنواع تماماً على
#   الاستدعاء المصاب بثغرة قفل الحساب. strict-inference يمنع تكرار ذلك.
#
# للتشغيل:  flutter analyze
# ─────────────────────────────────────────────────────────────────────────────

include: package:flutter_lints/flutter.yaml

analyzer:
  # ── قواعد النوع الصارمة ──────────────────────────────────────────────────
  language:
    # يمنع التحويل الضمني من dynamic إلى نوع محدد (مصدر شائع لأخطاء وقت التشغيل)
    strict-casts: true
    # يمنع استخدام الأنواع العامة بلا معاملات (مثل List بدل List<String>)
    strict-raw-types: true
    # يمنع استنتاج النوع كـ dynamic بصمت — يجب التصريح بالنوع
    strict-inference: true

  # ── استثناء الملفات المُولَّدة تلقائياً من التحليل ────────────────────────
  # هذه الملفات يولّدها build_runner ولا نتحكم في أسلوبها
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"

  # ── رفع خطورة بعض التحذيرات إلى أخطاء ───────────────────────────────────
  errors:
    # استخدام BuildContext بعد await بلا فحص mounted — سبب تعطّل شائع
    use_build_context_synchronously: error
    # نتيجة Future مُهمَلة (await منسي) — خطير جداً في العمليات المالية
    unawaited_futures: error
    # استيراد غير مستخدم — يبقي الكود نظيفاً
    unused_import: warning
    # متغير محلي غير مستخدم
    unused_local_variable: warning

linter:
  rules:
    # ── قواعد أمان العمليات غير المتزامنة ─────────────────────────────────
    # يفرض التعامل مع كل Future (إما await أو unawaited صراحةً)
    unawaited_futures: true
    # يمنع استخدام BuildContext عبر فجوة async بلا حماية
    use_build_context_synchronously: true

    # ── قواعد جودة عامة ───────────────────────────────────────────────────
    # يمنع print() في كود الإنتاج — يجب استخدام سجل مناسب
    avoid_print: true
    # يفرض التصريح بنوع إرجاع كل دالة
    always_declare_return_types: true
